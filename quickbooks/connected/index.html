<script>
(function(){
var q=new URLSearchParams(location.search),s=q.get('status'),co=(q.get('company')||'').slice(0,200),m=(q.get('message')||'').slice(0,500);
var t=document.getElementById('title'),msg=document.getElementById('msg'),more=document.getElementById('more');
if(s==='connected'){
  t.textContent='QuickBooks is connected';
  msg.textContent=co?co+' is now connected to Bowl, read only.':'The company is now connected to Bowl, read only.';
  more.textContent='The restaurant\u2019s owner has been notified. You can close this window.';
}else if(s==='cancelled'){
  t.textContent='Nothing was connected';
  msg.textContent='The connection was cancelled, so Bowl has no access to QuickBooks.';
  more.textContent='To try again, ask the owner to send a new link from the Bowl app if this one no longer works.';
}else{
  t.textContent='Something went wrong';
  msg.textContent=m||'QuickBooks couldn\u2019t be connected.';
  more.textContent='Please try again, or ask the owner to send a new link from the Bowl app.';
}
document.title=t.textContent+' \u00b7 Bowl';
})();
</script>
